name: Build macOS
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle_android:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: inputs.bundle_android
        with:
          name: duodesk-android
          path: android/dist
      - name: Restore optional user-supplied Developer ID identity
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/duodesk-signing.keychain-db"
            keychain_password=$(openssl rand -hex 24)
            echo "::add-mask::$keychain_password"
            printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/duodesk-signing.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
            security import "$RUNNER_TEMP/duodesk-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ && !id {id=$2} END {print id}')
            test -n "$identity"
            echo "MAC_IDENTITY=$identity" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        working-directory: mac
        run: npm ci
      - name: Source and preload tests
        run: |
          node .github/actions/check-source/check.cjs
          node mac/test/preload.test.cjs
          sh mac-helper/test/run.sh
      - name: Build Apple silicon app and DMG
        working-directory: mac
        env:
          MAC_APP_PROFILE_BASE64: ${{ secrets.MAC_APP_PROFILE_BASE64 }}
          MAC_CAMERA_PROFILE_BASE64: ${{ secrets.MAC_CAMERA_PROFILE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_APP_PROFILE_BASE64" ] && [ -n "$MAC_CAMERA_PROFILE_BASE64" ]; then
            printf '%s' "$MAC_APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/duodesk-app.provisionprofile"
            printf '%s' "$MAC_CAMERA_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/duodesk-camera.provisionprofile"
            export MAC_APP_PROFILE="$RUNNER_TEMP/duodesk-app.provisionprofile"
            export MAC_CAMERA_PROFILE="$RUNNER_TEMP/duodesk-camera.provisionprofile"
          fi
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: duodesk-mac
          path: mac/dist/DuoDesk*.dmg
          if-no-files-found: error
