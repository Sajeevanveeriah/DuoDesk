name: Build Arch package
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm git nodejs namcap
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duodesk-linux
          path: linux/aur
      - name: Prepare exact release package
        working-directory: linux/aur
        run: |
          v=$(node -p "require('../package.json').version")
          deb=$(find . -maxdepth 1 -name 'DuoDesk-*.deb' -print -quit)
          test -n "$deb"
          cp "$deb" "DuoDesk-$v-amd64.deb" 2>/dev/null || test "$deb" = "./DuoDesk-$v-amd64.deb"
          sum=$(sha256sum "DuoDesk-$v-amd64.deb" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$v/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" PKGBUILD
      - name: Build package
        working-directory: linux/aur
        run: |
          useradd -m builder
          chown -R builder .
          sudo -u builder makepkg --nodeps --force --noconfirm
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          namcap PKGBUILD
          test -n "$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: duodesk-aur
          include-hidden-files: true
          path: |
            linux/aur/PKGBUILD
            linux/aur/.SRCINFO
            linux/aur/*.pkg.tar.zst
          if-no-files-found: error
