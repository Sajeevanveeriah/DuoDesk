name: Build Windows
on:
  workflow_call:
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: duodesk-android
          path: android/dist
      - name: Install dependencies
        working-directory: windows
        run: npm ci
      - name: Source and compatibility checks
        run: node .github/actions/check-source/check.cjs
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem windows/scripts/*.ps1, windows-helper/calls/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Output "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Build x64 and ARM64 NSIS installers
        working-directory: windows
        run: npm run dist -- x64 arm64
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: duodesk-windows
          path: windows/dist/DuoDesk*.exe
          if-no-files-found: error
