name: Build Linux
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle_android:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: inputs.bundle_android
        with:
          name: duodesk-android
          path: android/dist
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxi-dev libxtst-dev libxext-dev libxrandr-dev libxfixes-dev libglib2.0-dev
      - name: Install dependencies
        working-directory: linux
        run: npm ci
      - name: Source and compatibility checks
        run: node .github/actions/check-source/check.cjs
      - name: Linux geometry tests
        run: |
          mkdir -p linux-helper/bin
          gcc -std=c11 -Wall -Wextra -Werror linux-helper/dev/edge-policy-test.c -o linux-helper/bin/edge-policy-test
          linux-helper/bin/edge-policy-test
          node linux/mesh/test/geometry.test.js
      - name: Build AppImage and Debian package
        working-directory: linux
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: duodesk-linux
          path: |
            linux/dist/DuoDesk*.AppImage
            linux/dist/DuoDesk*.deb
          if-no-files-found: error
