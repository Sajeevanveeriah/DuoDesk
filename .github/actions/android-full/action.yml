name: Prepare Android signing
description: Restore a user-supplied durable key for a release; never silently publish an ephemeral key.
inputs:
  release:
    default: 'false'
  keystore:
    default: ''
  store-password:
    default: ''
  key-alias:
    default: ''
  key-password:
    default: ''
runs:
  using: composite
  steps:
    - name: Validate and restore signing identity
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        KEYSTORE: ${{ inputs.keystore }}
        STORE_PASSWORD: ${{ inputs.store-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        if [ -z "$KEYSTORE" ]; then
          if [ "$RELEASE" = 'true' ]; then
            echo '::error::Release requires ANDROID_KEYSTORE and its password/alias secrets. No release will be published.'
            exit 1
          fi
          echo '::warning::Validation build uses an ephemeral debug signature; it is not an upgrade-compatible release.'
          exit 0
        fi
        test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo '::error::Incomplete Android signing configuration'; exit 1; }
        umask 077
        printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/duodesk-release.jks"
        echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/duodesk-release.jks" >> "$GITHUB_ENV"
